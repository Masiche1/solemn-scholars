{% extends "base.html" %}
{% block title %}Page not found — Tutorly{% endblock %}
{% block content %}
<section class="section-sm" style="padding:80px 0;">
  <div class="container narrow text-center">
    <div style="font-size:4.5rem; line-height:1;">🔍</div>
    <h1 style="margin:16px 0 8px;">Page not found</h1>
    <p class="muted" style="max-width:480px; margin:0 auto 24px;">We couldn't find the page you were looking for. It may have moved, been removed, or the link might be slightly wrong.</p>
    <div class="flex gap" style="justify-content:center; flex-wrap:wrap;">
      <a href="{{ url_for('public.home') }}" class="btn btn-primary">Back to home</a>
      <a href="{{ url_for('directory.directory') }}" class="btn btn-outline">Find a tutor</a>
    </div>
  </div>
</section>
{% endblock %}
