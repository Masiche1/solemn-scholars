{% extends "base.html" %}
{% block title %}Something went wrong — Tutorly{% endblock %}
{% block content %}
<section class="section-sm" style="padding:80px 0;">
  <div class="container narrow text-center">
    <div style="font-size:4.5rem; line-height:1;">⚠️</div>
    <h1 style="margin:16px 0 8px;">Something went wrong</h1>
    <p class="muted" style="max-width:480px; margin:0 auto 24px;">An unexpected error occurred on our end. Our team has been notified. Please try again in a moment.</p>
    <div class="flex gap" style="justify-content:center; flex-wrap:wrap;">
      <a href="{{ url_for('public.home') }}" class="btn btn-primary">Back to home</a>
      <a href="{{ url_for('public.contact') }}" class="btn btn-outline">Contact support</a>
    </div>
  </div>
</section>
{% endblock %}
